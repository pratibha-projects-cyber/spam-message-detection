<!DOCTYPE html>
<html>
<head>
    <title>Login - Fake Message Detection</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #111827;
            margin-bottom: 8px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .signup-text {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🛡️ Welcome Back</h1>

        <p>Fake Message Detection</p>

        <form method="POST" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup-text">
            Don't have an account?
            <a href="/signup">Create Account</a>
        </div>

    </div>

</body>
</html>
